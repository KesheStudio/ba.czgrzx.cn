[package]
name = "ba_czgrzx_cn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
askama = "0.12.1"
askama_web = { version = "0.12", features = ["axum-0.8"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql", "macros", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
tower-http = { version = "0.7.1", features = ["fs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
